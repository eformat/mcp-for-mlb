deploymentSpec:
  executors:
    exec-aggregate-score-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - aggregate_score_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mlflow>=3.10'\
          \ 'nest-asyncio>=1.6.0' 'pydantic>=2.0.0' 'httpx>=0.27.0' 'trino>=0.329'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef aggregate_score_op(\n    mlflow_tracking_uri: str,\n    trino_host:\
          \ str,\n    trino_port: int,\n    mlflow_workspace: str = \"\",\n    experiment_name:\
          \ str = \"\",\n    agent_model: str = \"\",\n) -> dict:\n    \"\"\"Query\
          \ backtest_results from Trino, compute accuracy, log to MLflow.\"\"\"\n\
          \    import json\n    import os\n    from pathlib import Path\n\n    os.environ[\"\
          MLFLOW_TRACKING_INSECURE_TLS\"] = \"true\"\n    if not os.environ.get(\"\
          MLFLOW_TRACKING_TOKEN\"):\n        sa_token_path = Path(\"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
          )\n        if sa_token_path.exists():\n            os.environ[\"MLFLOW_TRACKING_TOKEN\"\
          ] = sa_token_path.read_text().strip()\n\n    import mlflow\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \    if mlflow_workspace:\n        mlflow.set_workspace(mlflow_workspace)\n\
          \        import mlflow.tracking.fluent as _fluent\n        client = mlflow.MlflowClient()\n\
          \        exps = client.search_experiments(filter_string=f\"name = '{experiment_name}'\"\
          )\n        if exps:\n            _fluent._active_experiment_id = exps[0].experiment_id\n\
          \        else:\n            _fluent._active_experiment_id = client.create_experiment(experiment_name)\n\
          \    else:\n        mlflow.set_experiment(experiment_name)\n\n    from trino.dbapi\
          \ import connect as trino_connect\n\n    print(\"Querying backtest_results\
          \ from Trino...\", flush=True)\n    conn = trino_connect(host=trino_host,\
          \ port=trino_port, user=\"admin\",\n                         catalog=\"\
          lakehouse\", schema=\"mlb\")\n    cur = conn.cursor()\n\n    # Overall accuracy\n\
          \    cur.execute(\"\"\"\n        SELECT COUNT(*) AS total, SUM(was_correct)\
          \ AS correct,\n               ROUND(CAST(SUM(was_correct) AS DOUBLE) / NULLIF(COUNT(*),\
          \ 0), 4) AS accuracy\n        FROM lakehouse.mlb.backtest_results\n    \"\
          \"\")\n    row = cur.fetchone()\n    total, correct, accuracy = int(row[0]),\
          \ int(row[1] or 0), float(row[2] or 0)\n\n    # Total games in dataset\n\
          \    cur.execute(\"SELECT COUNT(*) FROM lakehouse.mlb.live_games WHERE game_status\
          \ = 'Final'\")\n    total_games = int(cur.fetchone()[0])\n\n    # Per-tier\
          \ accuracy\n    cur.execute(\"\"\"\n        SELECT confidence, COUNT(*)\
          \ AS picks, SUM(was_correct) AS correct,\n               ROUND(CAST(SUM(was_correct)\
          \ AS DOUBLE) / NULLIF(COUNT(*), 0), 4) AS accuracy\n        FROM lakehouse.mlb.backtest_results\n\
          \        GROUP BY confidence ORDER BY accuracy DESC\n    \"\"\")\n    tier_rows\
          \ = cur.fetchall()\n\n    # Per-team accuracy (which teams do we predict\
          \ best/worst)\n    cur.execute(\"\"\"\n        SELECT picked_team, COUNT(*)\
          \ AS picks, SUM(was_correct) AS correct,\n               ROUND(CAST(SUM(was_correct)\
          \ AS DOUBLE) / NULLIF(COUNT(*), 0), 4) AS accuracy\n        FROM lakehouse.mlb.backtest_results\n\
          \        GROUP BY picked_team HAVING COUNT(*) >= 5\n        ORDER BY accuracy\
          \ DESC\n    \"\"\")\n    team_rows = cur.fetchall()\n\n    # Wrong picks\
          \ sample\n    cur.execute(\"\"\"\n        SELECT game_date, away_team, home_team,\
          \ picked_team, confidence, actual_winner\n        FROM lakehouse.mlb.backtest_results\n\
          \        WHERE was_correct = 0\n        ORDER BY game_date DESC LIMIT 50\n\
          \    \"\"\")\n    wrong_picks = cur.fetchall()\n    conn.close()\n\n   \
          \ # Print report\n    print(f\"\\n{'=' * 60}\", flush=True)\n    print(f\"\
          BACKTEST RESULTS ({agent_model})\", flush=True)\n    print(f\"{'=' * 60}\"\
          , flush=True)\n    print(f\"  Games in dataset: {total_games}\", flush=True)\n\
          \    print(f\"  Predictions made: {total}\", flush=True)\n    print(f\"\
          \  Coverage: {total / max(total_games, 1):.1%}\", flush=True)\n    print(f\"\
          \  Overall accuracy: {correct}/{total} ({accuracy:.1%})\", flush=True)\n\
          \    print(f\"\\n  By confidence tier:\", flush=True)\n    for tr in tier_rows:\n\
          \        print(f\"    {tr[0]:12s} {int(tr[2] or 0)}/{int(tr[1])} ({float(tr[3]\
          \ or 0):.1%})\", flush=True)\n    print(f\"\\n  Best teams to predict:\"\
          , flush=True)\n    for tr in team_rows[:5]:\n        print(f\"    {tr[0]:25s}\
          \ {int(tr[2] or 0)}/{int(tr[1])} ({float(tr[3] or 0):.1%})\", flush=True)\n\
          \    print(f\"\\n  Worst teams to predict:\", flush=True)\n    for tr in\
          \ team_rows[-5:]:\n        print(f\"    {tr[0]:25s} {int(tr[2] or 0)}/{int(tr[1])}\
          \ ({float(tr[3] or 0):.1%})\", flush=True)\n\n    # Log to MLflow\n    mlflow.start_run(run_name=f\"\
          backtest-{agent_model}\")\n    mlflow.log_param(\"model\", agent_model)\n\
          \    mlflow.log_param(\"total_games\", total_games)\n    mlflow.log_param(\"\
          predictions_made\", total)\n\n    mlflow.log_metric(\"overall_accuracy\"\
          , round(accuracy, 4))\n    mlflow.log_metric(\"correct\", correct)\n   \
          \ mlflow.log_metric(\"total_scored\", total)\n    mlflow.log_metric(\"coverage\"\
          , round(total / max(total_games, 1), 4))\n\n    for tr in tier_rows:\n \
          \       tier_key = tr[0].lower().replace(\" \", \"_\") if tr[0] else \"\
          unknown\"\n        mlflow.log_metric(f\"accuracy_{tier_key}\", round(float(tr[3]\
          \ or 0), 4))\n        mlflow.log_metric(f\"count_{tier_key}\", int(tr[1]))\n\
          \n    if wrong_picks:\n        import tempfile\n        wrong_data = [{\"\
          game_date\": str(w[0]), \"away\": w[1], \"home\": w[2],\n              \
          \          \"picked\": w[3], \"confidence\": w[4], \"actual\": w[5]}\n \
          \                      for w in wrong_picks]\n        with tempfile.NamedTemporaryFile(mode=\"\
          w\", suffix=\".json\", delete=False, prefix=\"wrong_picks_\") as f:\n  \
          \          f.write(json.dumps(wrong_data, indent=2))\n            mlflow.log_artifact(f.name,\
          \ \"wrong_picks\")\n\n    mlflow.end_run()\n\n    return {\n        \"overall_accuracy\"\
          : round(accuracy, 4),\n        \"correct\": correct,\n        \"total_scored\"\
          : total,\n        \"total_games\": total_games,\n        \"matched\": matched,\n\
          \        \"missed\": missed,\n        \"by_tier\": {k: {\"correct\": v[0],\
          \ \"total\": v[1]} for k, v in by_tier.items()},\n        \"wrong_count\"\
          : len(wrong_list),\n    }\n\n"
        image: python:3.12-slim
    exec-load-and-partition-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_and_partition_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mlflow>=3.10'\
          \ 'nest-asyncio>=1.6.0' 'pydantic>=2.0.0' 'httpx>=0.27.0' 'trino>=0.329'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_and_partition_op(\n    trino_host: str,\n    trino_port:\
          \ int,\n    batch_size: int = 30,\n) -> NamedTuple(\"LoadOutput\", [(\"\
          partitions\", List[str]), (\"all_games_json\", str)]):\n    \"\"\"Query\
          \ all completed games from Trino and partition into batches.\n\n    Returns:\n\
          \        partitions: list of JSON strings, each containing a batch of game\
          \ dicts\n        all_games_json: single JSON string of all games (for scoring)\n\
          \    \"\"\"\n    import json\n    from collections import namedtuple\n \
          \   from trino.dbapi import connect as trino_connect\n\n    print(\"Connecting\
          \ to Trino...\", flush=True)\n    conn = trino_connect(\n        host=trino_host,\n\
          \        port=trino_port,\n        user=\"admin\",\n        catalog=\"lakehouse\"\
          ,\n        schema=\"mlb\",\n    )\n    cur = conn.cursor()\n    cur.execute(\"\
          \"\"\n        SELECT game_pk, game_date, away_team_name, home_team_name,\n\
          \               away_score, home_score\n        FROM lakehouse.mlb.live_games\n\
          \        WHERE game_status = 'Final'\n        ORDER BY game_date\n    \"\
          \"\")\n    columns = [d[0] for d in cur.description]\n    rows = cur.fetchall()\n\
          \n    # Create/recreate backtest_results table for this run\n    print(\"\
          Creating backtest_results table...\", flush=True)\n    cur.execute(\"DROP\
          \ TABLE IF EXISTS lakehouse.mlb.backtest_results\")\n    cur.execute(\"\"\
          \"\n        CREATE TABLE lakehouse.mlb.backtest_results (\n            game_pk\
          \ INTEGER,\n            game_date VARCHAR,\n            away_team VARCHAR,\n\
          \            home_team VARCHAR,\n            picked_team VARCHAR,\n    \
          \        confidence VARCHAR,\n            actual_winner VARCHAR,\n     \
          \       was_correct INTEGER,\n            reasoning VARCHAR,\n         \
          \   agent_model VARCHAR\n        )\n    \"\"\")\n    print(\"  backtest_results\
          \ table ready\", flush=True)\n    conn.close()\n\n    # Build game dicts\
          \ with actual winner computed\n    games = []\n    for row in rows:\n  \
          \      g = dict(zip(columns, row))\n        g[\"actual_winner\"] = (\n \
          \           g[\"home_team_name\"]\n            if g[\"home_score\"] > g[\"\
          away_score\"]\n            else g[\"away_team_name\"]\n        )\n     \
          \   games.append(g)\n\n    # Sort by game_date (already ordered by query,\
          \ but be explicit)\n    games.sort(key=lambda g: g[\"game_date\"])\n\n \
          \   print(f\"Total completed games: {len(games)}\", flush=True)\n\n    #\
          \ Partition into batches\n    batches = []\n    for i in range(0, len(games),\
          \ batch_size):\n        batch = games[i : i + batch_size]\n        batches.append(json.dumps(batch))\n\
          \n    print(f\"Partitioned into {len(batches)} batches of ~{batch_size}\"\
          , flush=True)\n\n    LoadOutput = namedtuple(\"LoadOutput\", [\"partitions\"\
          , \"all_games_json\"])\n    return LoadOutput(partitions=batches, all_games_json=json.dumps(games))\n\
          \n"
        image: python:3.12-slim
