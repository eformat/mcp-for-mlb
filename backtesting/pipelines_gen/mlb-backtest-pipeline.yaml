# PIPELINE DEFINITION
# Name: mlb-backtesting
# Description: Parallel backtesting on all completed 2026 games
# Inputs:
#    agent_model: str [Default: 'qwen38-27b']
#    batch_size: int [Default: 30.0]
#    gcp_adc_secret_name: str [Default: 'gcp-adc']
#    llm_base_url: str [Default: 'https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen38-27b/v1']
#    llm_secret_name: str [Default: 'mlb-agent-maas-key']
#    mlflow_experiment_name: str [Default: 'mlb-backtesting']
#    mlflow_tracking_uri: str [Default: 'https://mlflow.redhat-ods-applications.svc:8443/mlflow']
#    mlflow_workspace: str [Default: 'mlb-agent']
#    parallelism: int [Default: 16.0]
#    prompt_name: str [Default: 'mlb-agent.system']
#    trino_host: str [Default: 'trino.mlb-agent.svc.cluster.local']
#    trino_port: int [Default: 8080.0]
components:
  comp-aggregate-score-op:
    executorLabel: exec-aggregate-score-op
    inputDefinitions:
