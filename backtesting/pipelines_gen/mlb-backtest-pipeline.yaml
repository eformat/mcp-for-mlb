        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mlflow>=3.10'\
          \ 'nest-asyncio>=1.6.0' 'pydantic>=2.0.0' 'httpx>=0.27.0' 'langchain>=0.3'\
          \ 'langchain-openai>=0.3' 'langchain-google-vertexai>=2.0' 'langchain-core>=0.3'\
          \ 'langgraph>=0.4' 'trino>=0.329' 'openai>=1.0' 'anthropic>=0.40'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef predict_batch_op(\n    games_json: str,\n    mlflow_tracking_uri:\
          \ str,\n    agent_model: str,\n    llm_base_url: str,\n    prompt_name:\
          \ str,\n    trino_host: str,\n    trino_port: int,\n    mlflow_workspace:\
          \ str = \"\",\n) -> str:\n    \"\"\"Predict outcomes for a batch of ~30\
          \ games. Fully self-contained.\"\"\"\n    import asyncio\n    import json\n\
          \    import os\n    import re\n    from pathlib import Path\n\n    # ----\
          \ MLflow setup ----\n    os.environ[\"MLFLOW_TRACKING_INSECURE_TLS\"] =\
          \ \"true\"\n    if not os.environ.get(\"MLFLOW_TRACKING_TOKEN\"):\n    \
          \    sa_token_path = Path(\"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
          )\n        if sa_token_path.exists():\n            os.environ[\"MLFLOW_TRACKING_TOKEN\"\
          ] = sa_token_path.read_text().strip()\n\n    adc_path = Path(\"/adc/application_default_credentials.json\"\
          )\n    if adc_path.exists():\n        os.environ[\"GOOGLE_APPLICATION_CREDENTIALS\"\
          ] = str(adc_path)\n\n    import mlflow\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \    if mlflow_workspace:\n        mlflow.set_workspace(mlflow_workspace)\n\
          \n    try:\n        import nest_asyncio\n        nest_asyncio.apply()\n\
          \    except ImportError:\n        pass\n\n    # ---- Prediction parsing\
          \ (inlined) ----\n    TEAM_ALIASES = {\n        \"arizona diamondbacks\"\
          : \"Arizona Diamondbacks\", \"diamondbacks\": \"Arizona Diamondbacks\",\
          \ \"d-backs\": \"Arizona Diamondbacks\", \"ari\": \"Arizona Diamondbacks\"\
          ,\n        \"atlanta braves\": \"Atlanta Braves\", \"braves\": \"Atlanta\
          \ Braves\", \"atl\": \"Atlanta Braves\",\n        \"baltimore orioles\"\
          : \"Baltimore Orioles\", \"orioles\": \"Baltimore Orioles\", \"bal\": \"\
          Baltimore Orioles\",\n        \"boston red sox\": \"Boston Red Sox\", \"\
          red sox\": \"Boston Red Sox\", \"bos\": \"Boston Red Sox\",\n        \"\
          chicago cubs\": \"Chicago Cubs\", \"cubs\": \"Chicago Cubs\", \"chc\": \"\
