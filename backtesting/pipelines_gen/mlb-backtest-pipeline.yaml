          : \"Detroit Tigers\", \"det\": \"Detroit Tigers\",\n        \"houston astros\"\
          : \"Houston Astros\", \"astros\": \"Houston Astros\", \"hou\": \"Houston\
          \ Astros\",\n        \"kansas city royals\": \"Kansas City Royals\", \"\
          royals\": \"Kansas City Royals\", \"kc\": \"Kansas City Royals\",\n    \
          \    \"los angeles angels\": \"Los Angeles Angels\", \"angels\": \"Los Angeles\
          \ Angels\", \"laa\": \"Los Angeles Angels\",\n        \"los angeles dodgers\"\
          : \"Los Angeles Dodgers\", \"dodgers\": \"Los Angeles Dodgers\", \"lad\"\
          : \"Los Angeles Dodgers\",\n        \"miami marlins\": \"Miami Marlins\"\
          , \"marlins\": \"Miami Marlins\", \"mia\": \"Miami Marlins\",\n        \"\
          milwaukee brewers\": \"Milwaukee Brewers\", \"brewers\": \"Milwaukee Brewers\"\
          , \"mil\": \"Milwaukee Brewers\",\n        \"minnesota twins\": \"Minnesota\
          \ Twins\", \"twins\": \"Minnesota Twins\", \"min\": \"Minnesota Twins\"\
          ,\n        \"new york mets\": \"New York Mets\", \"mets\": \"New York Mets\"\
          , \"nym\": \"New York Mets\",\n        \"new york yankees\": \"New York\
          \ Yankees\", \"yankees\": \"New York Yankees\", \"nyy\": \"New York Yankees\"\
          ,\n        \"oakland athletics\": \"Athletics\", \"athletics\": \"Athletics\"\
          , \"a's\": \"Athletics\", \"oak\": \"Athletics\",\n        \"philadelphia\
          \ phillies\": \"Philadelphia Phillies\", \"phillies\": \"Philadelphia Phillies\"\
          , \"phi\": \"Philadelphia Phillies\",\n        \"pittsburgh pirates\": \"\
          Pittsburgh Pirates\", \"pirates\": \"Pittsburgh Pirates\", \"pit\": \"Pittsburgh\
          \ Pirates\",\n        \"san diego padres\": \"San Diego Padres\", \"padres\"\
          : \"San Diego Padres\", \"sd\": \"San Diego Padres\",\n        \"san francisco\
          \ giants\": \"San Francisco Giants\", \"giants\": \"San Francisco Giants\"\
