        agent_model:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        experiment_name:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        mlflow_workspace:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        trino_host:
          parameterType: STRING
        trino_port:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
  comp-for-loop-1:
    dag:
      tasks:
        predict-batch-op:
          cachingOptions: {}
          componentRef:
            name: comp-predict-batch-op
          inputs:
            parameters:
              agent_model:
                componentInputParameter: pipelinechannel--agent_model
              games_json:
                componentInputParameter: pipelinechannel--load-and-partition-op-partitions-loop-item
              llm_base_url:
                componentInputParameter: pipelinechannel--llm_base_url
              mlflow_tracking_uri:
                componentInputParameter: pipelinechannel--mlflow_tracking_uri
              mlflow_workspace:
                componentInputParameter: pipelinechannel--mlflow_workspace
              prompt_name:
                componentInputParameter: pipelinechannel--prompt_name
              trino_host:
                componentInputParameter: pipelinechannel--trino_host
              trino_port:
                componentInputParameter: pipelinechannel--trino_port
          taskInfo:
            name: predict-batch-op
    inputDefinitions:
      parameters:
        pipelinechannel--agent_model:
          parameterType: STRING
        pipelinechannel--gcp_adc_secret_name:
          parameterType: STRING
        pipelinechannel--llm_base_url:
          parameterType: STRING
        pipelinechannel--llm_secret_name:
          parameterType: STRING
        pipelinechannel--load-and-partition-op-partitions:
          parameterType: LIST
        pipelinechannel--load-and-partition-op-partitions-loop-item:
          parameterType: STRING
        pipelinechannel--mlflow_tracking_uri:
          parameterType: STRING
        pipelinechannel--mlflow_workspace:
          parameterType: STRING
        pipelinechannel--prompt_name:
          parameterType: STRING
        pipelinechannel--trino_host:
          parameterType: STRING
        pipelinechannel--trino_port:
          parameterType: NUMBER_INTEGER
  comp-load-and-partition-op:
    executorLabel: exec-load-and-partition-op
    inputDefinitions:
      parameters:
        batch_size:
          defaultValue: 30.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        trino_host:
          parameterType: STRING
        trino_port:
          parameterType: NUMBER_INTEGER
