apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlb-mcp-server
  labels:
    app.kubernetes.io/name: mlb-mcp-server
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlb-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlb-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: quay.io/eformat/mlb-mcp-server:latest
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: TRINO_QUERY_HOST
              value: "trino"
            - name: TRINO_QUERY_PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
