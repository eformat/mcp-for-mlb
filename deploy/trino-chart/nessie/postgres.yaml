---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie-postgres
  labels:
    app: nessie-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nessie-postgres
  template:
    metadata:
      labels:
        app: nessie-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: nessie
            - name: POSTGRESQL_PASSWORD
              value: nessie
            - name: POSTGRESQL_DATABASE
              value: nessie
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nessie-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: nessie-postgres
spec:
  selector:
    app: nessie-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nessie-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
