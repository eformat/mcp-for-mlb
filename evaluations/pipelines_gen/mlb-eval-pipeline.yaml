          \    f\"Question: {question}\\nResponse: {response}\\n\\n\"\n          \
          \  f\"{criterion}\\n\\nReply with only YES or NO.\"\n        )\n       \
          \ try:\n            r = httpx.post(judge_chat_url, json={\n            \
          \    \"model\": judge_model,\n                \"messages\": [{\"role\":\
