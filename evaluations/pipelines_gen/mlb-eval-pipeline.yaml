pipelineInfo:
  description: Evaluate MLB agent on 7 capability dimensions using LLM-as-judge
  name: mlb-data-agent-evaluation
root:
  dag:
    tasks:
      create-dataset-op:
        cachingOptions: {}
        componentRef:
          name: comp-create-dataset-op
        dependentTasks:
        - setup-mlflow-op
        inputs:
          parameters:
            dataset_name:
              componentInputParameter: dataset_name
            experiment_name:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: setup-mlflow-op
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            mlflow_workspace:
              componentInputParameter: mlflow_workspace
        taskInfo:
          name: create-dataset-op
      generate-variants-op:
        cachingOptions: {}
        componentRef:
          name: comp-generate-variants-op
        dependentTasks:
        - create-dataset-op
        inputs:
          parameters:
            dataset_id:
              taskOutputParameter:
                outputParameterKey: dataset_id
                producerTask: create-dataset-op
            experiment_name:
              taskOutputParameter:
                outputParameterKey: experiment_name
                producerTask: create-dataset-op
            gen_model:
              componentInputParameter: judge_model
            llm_base_url:
              componentInputParameter: llm_base_url
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            mlflow_workspace:
              componentInputParameter: mlflow_workspace
            variants_per_seed:
              runtimeValue:
                constant: 3.0
        taskInfo:
          name: generate-variants-op
      report-results-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-report-results-op
        dependentTasks:
        - run-eval-op
        inputs:
          parameters:
            metrics:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: run-eval-op
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
        taskInfo:
          name: report-results-op
      run-eval-op:
        cachingOptions: {}
        componentRef:
          name: comp-run-eval-op
        dependentTasks:
        - generate-variants-op
        inputs:
          parameters:
            agent_model:
              componentInputParameter: agent_model
            dataset_id:
              taskOutputParameter:
                outputParameterKey: dataset_id
                producerTask: generate-variants-op
            experiment_name:
              taskOutputParameter:
                outputParameterKey: experiment_name
                producerTask: generate-variants-op
            judge_model:
              componentInputParameter: judge_model
            llm_base_url:
              componentInputParameter: llm_base_url
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            mlflow_workspace:
              componentInputParameter: mlflow_workspace
            trino_host:
              componentInputParameter: trino_host
            trino_port:
              componentInputParameter: trino_port
        taskInfo:
          name: run-eval-op
      setup-mlflow-op:
        cachingOptions: {}
        componentRef:
          name: comp-setup-mlflow-op
        inputs:
          parameters:
            mlflow_experiment_name:
              componentInputParameter: mlflow_experiment_name
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            mlflow_workspace:
              componentInputParameter: mlflow_workspace
        taskInfo:
          name: setup-mlflow-op
  inputDefinitions:
    parameters:
      agent_model:
        defaultValue: qwen36-27b
        isOptional: true
        parameterType: STRING
      dataset_name:
        defaultValue: mlb_data_eval
        isOptional: true
        parameterType: STRING
      judge_model:
        defaultValue: gemma4
        isOptional: true
        parameterType: STRING
      llm_base_url:
        defaultValue: http://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/gemma4/v1
        isOptional: true
        parameterType: STRING
      llm_secret_name:
        defaultValue: mlb-agent-maas-key
        isOptional: true
        parameterType: STRING
      mlflow_experiment_name:
        defaultValue: mlb-data-agent
        isOptional: true
        parameterType: STRING
      mlflow_tracking_uri:
        defaultValue: https://mlflow.redhat-ods-applications.svc:8443/mlflow
        isOptional: true
        parameterType: STRING
      mlflow_workspace:
        defaultValue: mlb-agent
        isOptional: true
        parameterType: STRING
      trino_host:
        defaultValue: trino.mlb-agent.svc.cluster.local
        isOptional: true
        parameterType: STRING
      trino_port:
        defaultValue: 8080.0
        isOptional: true
        parameterType: NUMBER_INTEGER
