          \     except Exception as e:\n            print(f\"  Judge error: {e}\"\
          , flush=True)\n            return False\n\n    @scorer\n    def cross_dataset_reasoning(inputs:\
          \ dict, outputs: str) -> bool:\n        return _call_judge(str(inputs),\
          \ str(outputs),\n            \"Does the response state which dataset or\
