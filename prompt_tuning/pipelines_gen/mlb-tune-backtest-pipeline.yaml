# PIPELINE DEFINITION
# Name: mlb-prompt-tuning
# Description: RL-based system prompt optimization for game prediction accuracy
# Inputs:
#    accuracy_target: float [Default: 0.65]
#    agent_model: str [Default: 'qwen36-27b']
#    eval_batch_size: int [Default: 40.0]
#    gcp_adc_secret_name: str [Default: 'gcp-adc']
#    llm_base_url: str [Default: 'https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen36-27b/v1']
#    llm_secret_name: str [Default: 'mlb-agent-maas-key']
#    max_steps: int [Default: 50.0]
#    meta_model: str [Default: 'claude-sonnet-4-6']
#    mlflow_experiment_name: str [Default: 'mlb-prompt-tuning-backtest']
#    mlflow_tracking_uri: str [Default: 'https://mlflow.redhat-ods-applications.svc:8443/mlflow']
#    mlflow_workspace: str [Default: 'mlb-agent']
#    trino_host: str [Default: 'trino.mlb-agent.svc.cluster.local']
#    trino_port: int [Default: 8080.0]
components:
  comp-report-results-op:
    executorLabel: exec-report-results-op
    inputDefinitions:
      parameters:
        metrics:
          parameterType: STRUCT
        mlflow_tracking_uri:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-run-tuning-op:
    executorLabel: exec-run-tuning-op
    inputDefinitions:
      parameters:
        accuracy_target:
          defaultValue: 0.65
          isOptional: true
          parameterType: NUMBER_DOUBLE
        agent_model:
          parameterType: STRING
        eval_batch_size:
          defaultValue: 40.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        experiment_name:
          parameterType: STRING
        llm_base_url:
          parameterType: STRING
        max_steps:
          defaultValue: 50.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        meta_model:
          defaultValue: claude-sonnet-4-6
          isOptional: true
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        mlflow_workspace:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        trino_host:
          defaultValue: trino
          isOptional: true
          parameterType: STRING
        trino_port:
          defaultValue: 8080.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRUCT
  comp-setup-mlflow-op:
    executorLabel: exec-setup-mlflow-op
    inputDefinitions:
      parameters:
        mlflow_experiment_name:
          parameterType: STRING
        mlflow_tracking_uri:
          parameterType: STRING
        mlflow_workspace:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-report-results-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - report_results_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pydantic>=2.0.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef report_results_op(metrics: dict, mlflow_tracking_uri: str) ->\
          \ str:\n    \"\"\"Print prompt tuning scorecard.\"\"\"\n    print(\"=\"\
          \ * 60)\n    print(\"MLB PROMPT TUNING REPORT\")\n    print(\"=\" * 60)\n\
          \n    if \"error\" in metrics:\n        print(f\"  ERROR: {metrics['error']}\"\
          )\n        return f\"Tuning failed: {metrics['error']}\"\n\n    print(f\"\
          \  Best accuracy:  {metrics.get('best_accuracy', 0):.1%}\")\n    print(f\"\
          \  Total steps:    {metrics.get('final_step', 0)}\")\n    print(f\"  Best\
          \ version:   v{metrics.get('best_version', '?')}\")\n\n    history = metrics.get(\"\
          accuracy_history\", [])\n    if history:\n        print(f\"  Accuracy trend:\
          \ {' \u2192 '.join(f'{a:.1%}' for a in history)}\")\n\n    print(f\"\\nView\
          \ in MLflow: {mlflow_tracking_uri}\")\n    return f\"Tuning complete. Best\
          \ accuracy: {metrics.get('best_accuracy', 0):.1%}\"\n\n"
        image: python:3.12-slim
    exec-run-tuning-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - run_tuning_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mlflow>=3.10'\
          \ 'nest-asyncio>=1.6.0' 'pydantic>=2.0.0' 'httpx>=0.27.0' 'numpy>=1.26'\
          \ 'langchain>=0.3' 'langchain-openai>=0.3' 'langchain-google-vertexai>=2.0'\
          \ 'langchain-core>=0.3' 'langgraph>=0.4' 'trino>=0.329' 'openai>=1.0' 'anthropic>=0.40'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef run_tuning_op(\n    mlflow_tracking_uri: str,\n    experiment_name:\
          \ str,\n    agent_model: str,\n    llm_base_url: str,\n    trino_host: str\
          \ = \"trino\",\n    trino_port: int = 8080,\n    max_steps: int = 50,\n\
          \    eval_batch_size: int = 40,\n    accuracy_target: float = 0.65,\n  \
          \  mlflow_workspace: str = \"\",\n    meta_model: str = \"claude-sonnet-4-6\"\
          ,\n) -> dict:\n    \"\"\"RL prompt tuning: iteratively improve the Game\
          \ Prediction Framework.\"\"\"\n    import asyncio\n    import json\n   \
          \ import os\n    import re\n    from pathlib import Path\n\n    import numpy\
          \ as np\n\n    os.environ[\"MLFLOW_TRACKING_INSECURE_TLS\"] = \"true\"\n\
          \    if not os.environ.get(\"MLFLOW_TRACKING_TOKEN\"):\n        sa_token_path\
          \ = Path(\"/var/run/secrets/kubernetes.io/serviceaccount/token\")\n    \
          \    if sa_token_path.exists():\n            os.environ[\"MLFLOW_TRACKING_TOKEN\"\
          ] = sa_token_path.read_text().strip()\n\n    adc_path = Path(\"/adc/application_default_credentials.json\"\
          )\n    if adc_path.exists():\n        os.environ[\"GOOGLE_APPLICATION_CREDENTIALS\"\
          ] = str(adc_path)\n\n    import mlflow\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \    if mlflow_workspace:\n        mlflow.set_workspace(mlflow_workspace)\n\
          \        import mlflow.tracking.fluent as _fluent\n        client = mlflow.MlflowClient()\n\
          \        exps = client.search_experiments(filter_string=f\"name = '{experiment_name}'\"\
          )\n        if exps:\n            _fluent._active_experiment_id = exps[0].experiment_id\n\
          \        else:\n            _fluent._active_experiment_id = client.create_experiment(experiment_name)\n\
          \    else:\n        mlflow.set_experiment(experiment_name)\n\n    # ------------------------------------------------------------------\n\
          \    # Prompt splitting and validation\n    # ------------------------------------------------------------------\n\
          \    START_MARKER = \"### Game Prediction Framework\"\n    END_MARKER =\
          \ \"### Statistics Definitions\"\n    PLACEHOLDER = \"{PREDICTION_FRAMEWORK}\"\
          \n\n    def split_prompt(full_text):\n        start = full_text.find(START_MARKER)\n\
          \        end = full_text.find(END_MARKER)\n        if start == -1 or end\
          \ == -1:\n            raise ValueError(\"Could not find section markers\
          \ in prompt\")\n        mutable = full_text[start:end].rstrip() + \"\\n\"\
          \n        template = full_text[:start] + PLACEHOLDER + \"\\n\" + full_text[end:]\n\
          \        return template, mutable\n\n    def reconstruct(template, section):\n\
          \        return template.replace(PLACEHOLDER, section.rstrip() + \"\\n\"\
          )\n\n    def validate_section(section):\n        issues = []\n        required\
          \ = [\"Step 1\", \"Step 2\", \"Step 3\", \"Output Format\", \"Anti-Patterns\"\
          ]\n        for h in required:\n            if h not in section:\n      \
          \          issues.append(f\"Missing: {h}\")\n        if len(section) > 20000:\n\
          \            issues.append(f\"Too long: {len(section)} chars\")\n      \
          \  if len(section) < 200:\n            issues.append(f\"Too short: {len(section)}\
          \ chars\")\n        return (len(issues) == 0, issues)\n\n    # ------------------------------------------------------------------\n\
          \    # Inlined: prediction parsing (from load-predictions-trino.py)\n  \
          \  # ------------------------------------------------------------------\n\
          \    TEAM_ALIASES = {\n        \"arizona diamondbacks\": \"Arizona Diamondbacks\"\
          , \"diamondbacks\": \"Arizona Diamondbacks\", \"d-backs\": \"Arizona Diamondbacks\"\
          , \"ari\": \"Arizona Diamondbacks\",\n        \"atlanta braves\": \"Atlanta\
          \ Braves\", \"braves\": \"Atlanta Braves\", \"atl\": \"Atlanta Braves\"\
          ,\n        \"baltimore orioles\": \"Baltimore Orioles\", \"orioles\": \"\
          Baltimore Orioles\", \"bal\": \"Baltimore Orioles\",\n        \"boston red\
          \ sox\": \"Boston Red Sox\", \"red sox\": \"Boston Red Sox\", \"bos\": \"\
          Boston Red Sox\",\n        \"chicago cubs\": \"Chicago Cubs\", \"cubs\"\
          : \"Chicago Cubs\", \"chc\": \"Chicago Cubs\",\n        \"chicago white\
          \ sox\": \"Chicago White Sox\", \"white sox\": \"Chicago White Sox\", \"\
          cws\": \"Chicago White Sox\", \"chw\": \"Chicago White Sox\",\n        \"\
          cincinnati reds\": \"Cincinnati Reds\", \"reds\": \"Cincinnati Reds\", \"\
          cin\": \"Cincinnati Reds\",\n        \"cleveland guardians\": \"Cleveland\
          \ Guardians\", \"guardians\": \"Cleveland Guardians\", \"cle\": \"Cleveland\
          \ Guardians\",\n        \"colorado rockies\": \"Colorado Rockies\", \"rockies\"\
          : \"Colorado Rockies\", \"col\": \"Colorado Rockies\",\n        \"detroit\
          \ tigers\": \"Detroit Tigers\", \"tigers\": \"Detroit Tigers\", \"det\"\
          : \"Detroit Tigers\",\n        \"houston astros\": \"Houston Astros\", \"\
          astros\": \"Houston Astros\", \"hou\": \"Houston Astros\",\n        \"kansas\
          \ city royals\": \"Kansas City Royals\", \"royals\": \"Kansas City Royals\"\
          , \"kc\": \"Kansas City Royals\",\n        \"los angeles angels\": \"Los\
          \ Angeles Angels\", \"angels\": \"Los Angeles Angels\", \"laa\": \"Los Angeles\
          \ Angels\",\n        \"los angeles dodgers\": \"Los Angeles Dodgers\", \"\
          dodgers\": \"Los Angeles Dodgers\", \"lad\": \"Los Angeles Dodgers\",\n\
          \        \"miami marlins\": \"Miami Marlins\", \"marlins\": \"Miami Marlins\"\
          , \"mia\": \"Miami Marlins\",\n        \"milwaukee brewers\": \"Milwaukee\
          \ Brewers\", \"brewers\": \"Milwaukee Brewers\", \"mil\": \"Milwaukee Brewers\"\
          ,\n        \"minnesota twins\": \"Minnesota Twins\", \"twins\": \"Minnesota\
          \ Twins\", \"min\": \"Minnesota Twins\",\n        \"new york mets\": \"\
          New York Mets\", \"mets\": \"New York Mets\", \"nym\": \"New York Mets\"\
          ,\n        \"new york yankees\": \"New York Yankees\", \"yankees\": \"New\
          \ York Yankees\", \"nyy\": \"New York Yankees\",\n        \"oakland athletics\"\
          : \"Athletics\", \"athletics\": \"Athletics\", \"a's\": \"Athletics\", \"\
          oak\": \"Athletics\",\n        \"philadelphia phillies\": \"Philadelphia\
          \ Phillies\", \"phillies\": \"Philadelphia Phillies\", \"phi\": \"Philadelphia\
          \ Phillies\",\n        \"pittsburgh pirates\": \"Pittsburgh Pirates\", \"\
          pirates\": \"Pittsburgh Pirates\", \"pit\": \"Pittsburgh Pirates\",\n  \
          \      \"san diego padres\": \"San Diego Padres\", \"padres\": \"San Diego\
          \ Padres\", \"sd\": \"San Diego Padres\",\n        \"san francisco giants\"\
          : \"San Francisco Giants\", \"giants\": \"San Francisco Giants\", \"sf\"\
          : \"San Francisco Giants\",\n        \"seattle mariners\": \"Seattle Mariners\"\
          , \"mariners\": \"Seattle Mariners\", \"sea\": \"Seattle Mariners\",\n \
          \       \"st. louis cardinals\": \"St. Louis Cardinals\", \"cardinals\"\
          : \"St. Louis Cardinals\", \"stl\": \"St. Louis Cardinals\",\n        \"\
          tampa bay rays\": \"Tampa Bay Rays\", \"rays\": \"Tampa Bay Rays\", \"tb\"\
          : \"Tampa Bay Rays\",\n        \"texas rangers\": \"Texas Rangers\", \"\
          rangers\": \"Texas Rangers\", \"tex\": \"Texas Rangers\",\n        \"toronto\
          \ blue jays\": \"Toronto Blue Jays\", \"blue jays\": \"Toronto Blue Jays\"\
          , \"tor\": \"Toronto Blue Jays\",\n        \"washington nationals\": \"\
          Washington Nationals\", \"nationals\": \"Washington Nationals\", \"wsh\"\
          : \"Washington Nationals\",\n        \"boston\": \"Boston Red Sox\", \"\
          cleveland\": \"Cleveland Guardians\", \"colorado\": \"Colorado Rockies\"\
          ,\n        \"cincinnati\": \"Cincinnati Reds\", \"baltimore\": \"Baltimore\
          \ Orioles\", \"arizona\": \"Arizona Diamondbacks\",\n        \"atlanta\"\
          : \"Atlanta Braves\", \"st. louis\": \"St. Louis Cardinals\", \"st louis\"\
          : \"St. Louis Cardinals\",\n        \"detroit\": \"Detroit Tigers\", \"\
          houston\": \"Houston Astros\", \"kansas city\": \"Kansas City Royals\",\n\
          \        \"miami\": \"Miami Marlins\", \"milwaukee\": \"Milwaukee Brewers\"\
          , \"minnesota\": \"Minnesota Twins\",\n        \"philadelphia\": \"Philadelphia\
          \ Phillies\", \"pittsburgh\": \"Pittsburgh Pirates\",\n        \"san diego\"\
          : \"San Diego Padres\", \"san francisco\": \"San Francisco Giants\",\n \
          \       \"seattle\": \"Seattle Mariners\", \"tampa bay\": \"Tampa Bay Rays\"\
          , \"texas\": \"Texas Rangers\",\n        \"toronto\": \"Toronto Blue Jays\"\
          , \"washington\": \"Washington Nationals\", \"oakland\": \"Athletics\",\n\
          \    }\n\n    def clean_markdown(text):\n        if not text:\n        \
          \    return text\n        text = text.replace(\"**\", \"\")\n        text\
          \ = re.sub(r'[\\U00002705\\U0000274c\\U0001f3c6\\U0001f4ca]', '', text)\n\
          \        return text.strip()\n\n    def normalize_team(name):\n        if\
          \ not name:\n            return None\n        cleaned = clean_markdown(name).strip()\n\
          \        cleaned = re.sub(r'^\\d+\\.\\s*', '', cleaned).strip()\n      \
          \  return TEAM_ALIASES.get(cleaned.lower(), cleaned)\n\n    def _extract_pitcher_name(text):\n\
          \        if not text:\n            return None\n        cleaned = clean_markdown(text).strip()\n\
          \        m = re.match(r\"([A-Za-z\\s.'-]+?)(?:\\(|$)\", cleaned)\n     \
          \   return m.group(1).strip() if m else cleaned[:50]\n\n    def parse_predictions(output_text):\n\
          \        if not output_text:\n            return []\n        text = clean_markdown(output_text)\n\
          \        preds = _parse_table_format(text)\n        if not preds:\n    \
          \        preds = _parse_header_format(text)\n        if not preds:\n   \
          \         preds = _parse_pick_lines(text)\n        return preds\n\n    def\
          \ _parse_table_format(text):\n        predictions = []\n        lines =\
          \ text.split(\"\\n\")\n        header_idx = matchup_col = pick_col = conf_col\
          \ = rationale_col = None\n        for i, line in enumerate(lines):\n   \
          \         if \"|\" not in line:\n                continue\n            cells\
          \ = [c.strip() for c in line.split(\"|\") if c.strip()]\n            lower_cells\
          \ = [c.lower() for c in cells]\n            if \"matchup\" in lower_cells:\n\
          \                header_idx = i\n                matchup_col = lower_cells.index(\"\
          matchup\")\n                pick_col = lower_cells.index(\"pick\") if \"\
          pick\" in lower_cells else None\n                conf_col = lower_cells.index(\"\
          confidence\") if \"confidence\" in lower_cells else None\n             \
          \   rationale_col = None\n                for label in (\"rationale\", \"\
          key factors\", \"reasoning\"):\n                    if label in lower_cells:\n\
          \                        rationale_col = lower_cells.index(label)\n    \
          \                    break\n                continue\n            if header_idx\
          \ is None or pick_col is None:\n                continue\n            if\
          \ re.match(r'^[\\s|:-]+$', line):\n                continue\n          \
          \  if len(cells) <= max(matchup_col, pick_col):\n                continue\n\
          \            matchup_text = cells[matchup_col]\n            pick_text =\
          \ cells[pick_col]\n            confidence = cells[conf_col].upper() if conf_col\
          \ and conf_col < len(cells) else None\n            rationale = cells[rationale_col]\
          \ if rationale_col and rationale_col < len(cells) else None\n          \
          \  if confidence:\n                conf_map = {\"HIGH\": \"STRONG\", \"\
          MODERATE\": \"LEAN\", \"LOW\": \"COIN FLIP\"}\n                confidence\
          \ = conf_map.get(confidence, confidence)\n            m = re.search(r'(.+?)\\\
          s+@\\s+(.+?)(?:\\s*[\u2014\\-\u2013]|\\s*$)', matchup_text)\n          \
          \  if not m:\n                continue\n            away = normalize_team(m.group(1))\n\
          \            home = normalize_team(m.group(2))\n            picked = normalize_team(pick_text)\n\
          \            if not picked:\n                continue\n            predictions.append({\"\
          away_team\": away, \"home_team\": home, \"picked_team\": picked, \"confidence\"\
          : confidence, \"reasoning\": rationale[:200] if rationale else None})\n\
          \        return predictions\n\n    def _parse_header_format(text):\n   \
          \     predictions = []\n        blocks = re.split(r'###\\s*', text)\n  \
          \      for block in blocks:\n            if not block.strip():\n       \
          \         continue\n            block_clean = re.sub(r'^\\d+\\.\\s*', '',\
          \ block.strip())\n            m = re.match(r'(.+?)\\s+@\\s+(.+?)(?:\\s*[\u2014\
          \\-\u2013].+?)?\\s*\\n', block_clean)\n            if not m:\n         \
          \       continue\n            away = normalize_team(m.group(1))\n      \
          \      home = normalize_team(m.group(2))\n            pick_m = re.search(r'Pick:\\\
          s*(.+?)(?:\\s*$)', block, re.M)\n            picked = normalize_team(pick_m.group(1))\
          \ if pick_m else None\n            conf_m = re.search(r'Confidence:\\s*(STRONG|LEAN|COIN\\\
          s*FLIP|HIGH|MODERATE|LOW)', block, re.I)\n            confidence = None\n\
          \            if conf_m:\n                conf_map = {\"HIGH\": \"STRONG\"\
          , \"MODERATE\": \"LEAN\", \"LOW\": \"COIN FLIP\"}\n                confidence\
          \ = conf_map.get(conf_m.group(1).upper(), conf_m.group(1).upper())\n   \
          \         reason_m = re.search(r'(?:[-\u2022]\\s+|Rationale:\\s*)(.+)',\
          \ block)\n            reasoning = reason_m.group(1).strip()[:200] if reason_m\
          \ else None\n            if not picked:\n                continue\n    \
          \        predictions.append({\"away_team\": away, \"home_team\": home, \"\
          picked_team\": picked, \"confidence\": confidence, \"reasoning\": reasoning})\n\
          \        return predictions\n\n    def _parse_pick_lines(text):\n      \
          \  predictions = []\n        lines = text.split(\"\\n\")\n        for i,\
          \ line in enumerate(lines):\n            pick_m = re.search(r'Pick:\\s*(.+?)(?:\\\
          s*$)', line)\n            if not pick_m:\n                continue\n   \
          \         picked = normalize_team(pick_m.group(1))\n            if not picked:\n\
          \                continue\n            away = home = None\n            for\
          \ j in range(max(0, i - 10), i):\n                mm = re.search(r'(.+?)\\\
          s+@\\s+(.+?)(?:\\s*[\u2014\\-\u2013]|\\s*$)', lines[j])\n              \
          \  if mm:\n                    away = normalize_team(mm.group(1))\n    \
          \                home = normalize_team(mm.group(2))\n                  \
          \  break\n            predictions.append({\"away_team\": away, \"home_team\"\
          : home, \"picked_team\": picked, \"confidence\": None, \"reasoning\": None})\n\
          \        return predictions\n\n    # ------------------------------------------------------------------\n\
          \    # Inlined: replay logic\n    # ------------------------------------------------------------------\n\
          \    from trino.dbapi import connect as trino_connect\n    from langchain_openai\
          \ import ChatOpenAI\n    from langgraph.prebuilt import create_react_agent\n\
          \    from langchain_core.messages import HumanMessage\n    from langchain_core.tools\
          \ import tool\n\n    try:\n        import nest_asyncio\n        nest_asyncio.apply()\n\
          \    except ImportError:\n        pass\n\n    BLOCKED_SQL = re.compile(r\"\
          \\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|TRUNCATE)\\b\", re.IGNORECASE)\n\
          \    STRING_LITERAL = re.compile(r\"'[^']*'\")\n\n    @tool\n    def query_trino_tool(sql:\
          \ str) -> str:\n        \"\"\"Execute a read-only SQL query against the\
          \ MLB Iceberg lakehouse.\n        Schema: lakehouse.mlb. Tables: batting,\
          \ pitching, fielding, people, teams, parks,\n        series_post, awards_players,\
          \ hall_of_fame, salaries, home_games, weather_stations,\n        weather_daily,\
          \ pitch_pitches, pitch_atbats, pitch_games, statcast_pitches,\n        live_games,\
          \ live_boxscore_batting, live_boxscore_pitching, live_plays,\n        live_pitches,\
          \ live_standings, prediction_history. Only SELECT allowed.\"\"\"\n     \
          \   if BLOCKED_SQL.search(STRING_LITERAL.sub(\"''\", sql)):\n          \
          \  return json.dumps({\"error\": \"Only SELECT queries allowed.\"})\n  \
          \      try:\n            conn = trino_connect(host=trino_host, port=trino_port,\
          \ user=\"admin\", catalog=\"lakehouse\", schema=\"mlb\")\n            cur\
          \ = conn.cursor()\n            cur.execute(sql)\n            columns = [d[0]\
          \ for d in cur.description] if cur.description else []\n            rows\
          \ = cur.fetchmany(500)\n            conn.close()\n            return json.dumps({\"\
          results\": [dict(zip(columns, r)) for r in rows], \"row_count\": len(rows)})\n\
          \        except Exception as e:\n            return json.dumps({\"error\"\
          : str(e)})\n\n    @tool\n    def describe_datasets(topic: str = \"\") ->\
          \ str:\n        \"\"\"List available MLB datasets.\"\"\"\n        return\
          \ json.dumps({\"datasets\": [\n            {\"name\": \"batting/pitching/fielding\"\
          , \"years\": \"1871-2025\"},\n            {\"name\": \"live_* (2026 season)\"\
          , \"years\": \"2026\"},\n            {\"name\": \"prediction_history\",\
          \ \"years\": \"2026\"},\n        ]})\n\n    @tool\n    def get_methodology(dataset_name:\
