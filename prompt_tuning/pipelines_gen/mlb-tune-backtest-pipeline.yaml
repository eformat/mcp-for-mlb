        isOptional: true
        parameterType: STRING
      llm_base_url:
        defaultValue: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen36-27b/v1
        isOptional: true
        parameterType: STRING
      llm_secret_name:
        defaultValue: mlb-agent-maas-key
        isOptional: true
        parameterType: STRING
      max_steps:
        defaultValue: 50.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      meta_model:
        defaultValue: claude-sonnet-4-6
        isOptional: true
        parameterType: STRING
      mlflow_experiment_name:
        defaultValue: mlb-prompt-tuning-backtest
        isOptional: true
        parameterType: STRING
      mlflow_tracking_uri:
        defaultValue: https://mlflow.redhat-ods-applications.svc:8443/mlflow
        isOptional: true
        parameterType: STRING
      mlflow_workspace:
