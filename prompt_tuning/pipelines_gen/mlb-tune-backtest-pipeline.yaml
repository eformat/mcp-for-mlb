        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mlflow>=3.10'\
          \ 'nest-asyncio>=1.6.0' 'pydantic>=2.0.0' 'httpx>=0.27.0'  &&  python3 -m\
          \ pip install --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef setup_mlflow_op(\n    mlflow_tracking_uri: str,\n    mlflow_experiment_name:\
          \ str,\n    mlflow_workspace: str = \"\",\n) -> str:\n    \"\"\"Configure\
          \ MLflow tracking and return experiment name.\"\"\"\n    import os\n   \
          \ from pathlib import Path\n    import mlflow\n\n    os.environ[\"MLFLOW_TRACKING_INSECURE_TLS\"\
          ] = \"true\"\n\n    if not os.environ.get(\"MLFLOW_TRACKING_TOKEN\"):\n\
          \        sa_token_path = Path(\"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
          )\n        if sa_token_path.exists():\n            os.environ[\"MLFLOW_TRACKING_TOKEN\"\
          ] = sa_token_path.read_text().strip()\n\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n\
          \n    if mlflow_workspace:\n        mlflow.set_workspace(mlflow_workspace)\n\
          \n    experiment_name = mlflow_experiment_name\n\n    if mlflow_workspace:\n\
          \        import mlflow.tracking.fluent as _fluent\n        client = mlflow.MlflowClient()\n\
          \        exps = client.search_experiments(filter_string=f\"name = '{experiment_name}'\"\
          )\n        if exps:\n            _fluent._active_experiment_id = exps[0].experiment_id\n\
          \        else:\n            _fluent._active_experiment_id = client.create_experiment(experiment_name)\n\
          \    else:\n        mlflow.set_experiment(experiment_name)\n\n    print(f\"\
          MLflow: {mlflow_tracking_uri} | Experiment: {experiment_name}\", flush=True)\n\
          \    return experiment_name\n\n"
        image: python:3.12-slim
pipelineInfo:
  description: RL-based system prompt optimization for game prediction accuracy
  name: mlb-prompt-tuning
root:
  dag:
    tasks:
      report-results-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-report-results-op
        dependentTasks:
        - run-tuning-op
        inputs:
          parameters:
            metrics:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: run-tuning-op
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
        taskInfo:
          name: report-results-op
      run-tuning-op:
        cachingOptions: {}
        componentRef:
          name: comp-run-tuning-op
        dependentTasks:
        - setup-mlflow-op
        inputs:
          parameters:
            accuracy_target:
              componentInputParameter: accuracy_target
            agent_model:
              componentInputParameter: agent_model
            eval_batch_size:
              componentInputParameter: eval_batch_size
            experiment_name:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: setup-mlflow-op
            llm_base_url:
              componentInputParameter: llm_base_url
            max_steps:
              componentInputParameter: max_steps
            meta_model:
              componentInputParameter: meta_model
            mlflow_tracking_uri:
              componentInputParameter: mlflow_tracking_uri
            mlflow_workspace:
              componentInputParameter: mlflow_workspace
            trino_host:
              componentInputParameter: trino_host
            trino_port:
              componentInputParameter: trino_port
        taskInfo:
          name: run-tuning-op
      setup-mlflow-op:
